<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Surat KFS - Ruang Kontrak TELKOM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="d-flex w-100">
    <!-- Sidebar -->
    <aside class="sidebar text-white p-3 d-flex flex-column justify-content-between">
      <div>
        <div class="d-flex align-items-center gap-2 px-2 pb-4">
          <div class="bg-white text-telkom rounded-3 d-flex align-items-center justify-content-center fw-bold" style="width:38px; height:38px;">
            <i class="bi bi-file-earmark-text"></i>
          </div>
          <div>
            <div class="fw-bold small">Ruang Kontrak</div>
            <div style="font-size:11px; opacity:0.8;">TELKOM KFS Workspace</div>
          </div>
        </div>
        <div class="px-2 pb-2 fw-bold" style="font-size:11px; opacity:0.85;">WORKSPCACE</div>
        <ul class="nav flex-column gap-1">
          <li class="nav-item">
            <a href="../pelanggan/pelanggan.html" class="nav-link d-flex justify-content-between align-items-center">
              <span><i class="bi bi-people me-2"></i>Pelanggan</span>
              <span class="badge rounded-pill bg-white bg-opacity-25" id="navPelangganCount">0</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="suratkfs.html" class="nav-link active d-flex justify-content-between align-items-center">
              <span><i class="bi bi-file-text me-2"></i>Surat KFS</span>
              <span class="badge rounded-pill bg-white bg-opacity-25" id="navSuratCount">0</span>
            </a>
          </li>
        </ul>
        <hr class="border-white border-opacity-25 my-3">
      </div>
      <div class="p-3 rounded-4" style="background: rgba(255,255,255,0.1);">
        <div class="d-flex align-items-center gap-2 mb-2">
          <div class="bg-white text-telkom rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:34px; height:34px;" id="userAvatar"></div>
          <div class="overflow-hidden">
            <div class="fw-bold small text-truncate" id="userName"></div>
            <div class="text-truncate" style="font-size:10px; opacity:0.8;" id="userEmail"></div>
          </div>
        </div>
        <a href="../login.html" class="text-white-50 text-decoration-none small"><i class="bi bi-box-arrow-right me-1"></i>Keluar</a>
      </div>
    </aside>

    <!-- Main Form -->
    <main class="flex-grow-1 p-4 p-lg-5">
      <div class="card border-0 bg-form-gray rounded-4 p-4 p-md-5 mx-auto" style="max-width: 780px;">
        <h6 class="fw-bold mb-1">Buat Surat KFS</h6>
        <p class="small fw-semibold mb-3">Lengkapi detail pihak dan layanan dari template kontrak.</p>

        <form id="kfsStep1Form">
          <!-- Pilih Pelanggan (Menggunakan input list agar bisa dicari) -->
          <div class="bg-white rounded-3 p-3 mb-4">
            <label class="form-label small fw-bold">Pilih Pelanggan *</label>
            <input class="form-control border-0 bg-card-gray fw-bold small" list-data list="datalistPelanggan" id="pilihPelanggan" placeholder="Ketik atau pilih nama perusahaan..." required autocomplete="off">
            <datalist id="datalistPelanggan"></datalist>
            <input type="hidden" id="pilihPelangganIdx" value="">
            <div class="small fw-semibold mt-2" style="font-size:11px;">Data identitas dan wakil akan diambil dari profil pelanggan.</div>
          </div>

          <!-- Informasi Kontrak -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="small fw-bold"><i class="bi bi-folder me-1"></i>Informasi Kontrak</span>
            <a href="../pelanggan/tambahpelanggan.html" class="small fw-bold text-dark text-decoration-none">+ Pelanggan Baru</a>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Nomor Kontrak</label>
              <input type="text" id="nomorKontrak" class="form-control border-0 rounded-3" placeholder="Contoh : K.TEL/..../HK.810/..../../...." required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Tanggal Kontrak</label>
              <input type="date" id="tanggalKontrak" class="form-control border-0 rounded-3" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Jenis Layanan</label>
              <select id="jenisLayanan" class="form-select border-0 rounded-3">
                <option value="Layanan Connectivity TELKOM">Connectivity TELKOM</option>
                <option value="Layanan Non-Connectivity TELKOM">Non-Connectivity TELKOM</option>
                <option value="Bundling Layanan Connectivity TELKOM & Solusi">Bundling Layanan Connectivity TELKOM &amp; Solusi</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Tingkat Availability</label>
              <input type="text" id="availability" class="form-control border-0 rounded-3" value="99.5">
            </div>
            <!-- Tambahan input Delivery Time yang sebelumnya terlewat -->
            <div class="col-md-12">
              <label class="form-label small fw-bold">Jangka Waktu Delivery (Hari)</label>
              <input type="number" id="deliveryTime" class="form-control border-0 rounded-3" placeholder="Contoh : 14" value="14">
            </div>
          </div>

          <!-- Rincian Layanan -->
          <div class="small fw-bold mb-3"><i class="bi bi-wifi me-1"></i>Rincian Layanan</div>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Nama Layanan*</label>
              <input type="text" id="namaLayanan" class="form-control border-0 rounded-3" placeholder="Contoh : Astinet" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Paket</label>
              <input type="text" id="paket" class="form-control border-0 rounded-3" placeholder="Nama Paket Layanan">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Lokasi Layanan</label>
              <input type="text" id="lokasi" class="form-control border-0 rounded-3" placeholder="Kota / Lokasi">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Alamat Instalasi</label>
              <input type="text" id="alamatInstalasi" class="form-control border-0 rounded-3" placeholder="Alamat Lengkap Instalasi">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Lebar Pita (Kbps)</label>
              <input type="number" id="lebarPita" class="form-control border-0 rounded-3" value="10000">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Biaya Instalasi (Rp)</label>
              <input type="number" id="biayaInstalasi" class="form-control border-0 rounded-3" min="0" value="0">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Biaya Bulanan (Rp)</label>
              <input type="number" id="biayaBulanan" class="form-control border-0 rounded-3" min="0" value="0">
            </div>

            <!-- Masa Berlaku (Sejajar Dari & Sampai) -->
            <div class="col-12 mt-3">
              <label class="form-label small fw-bold mb-1">Masa Berlaku</label>
              <div class="row g-2 align-items-center">
                <div class="col-md-6 d-flex align-items-center gap-2">
                  <label for="berlakuDari" class="small fw-bold mb-0" style="min-width: 34px;">Dari</label>
                  <input type="date" id="berlakuDari" class="form-control border-0 rounded-3" required>
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                  <label for="berlakuSampai" class="small fw-bold mb-0" style="min-width: 50px;">Sampai</label>
                  <input type="date" id="berlakuSampai" class="form-control border-0 rounded-3" required>
                </div>
              </div>
            </div>

            <div class="col-12">
              <label class="form-label small fw-bold">Jangka Waktu</label>
              <input type="text" id="jangkaWaktu" class="form-control border-0 rounded-3" placeholder="Contoh : 1 Bulan" required>
            </div>
          
          </div>

          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-telkom px-4 py-2 rounded-3 fw-semibold">Next →</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('kfs_user'));
    if (!user) {
      window.location.href = '../login.html';
    } else {
      document.getElementById('userName').textContent = user.name;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    }

    const pelangganList = JSON.parse(localStorage.getItem('kfs_pelanggan')) || [];
    const suratList = JSON.parse(localStorage.getItem('kfs_surat')) || [];
    document.getElementById('navPelangganCount').textContent = pelangganList.length;
    document.getElementById('navSuratCount').textContent = suratList.length;

    const inputPelanggan = document.getElementById('pilihPelanggan');
    const inputPelangganIdx = document.getElementById('pilihPelangganIdx');
    const datalistPelanggan = document.getElementById('datalistPelanggan');

    if (pelangganList.length === 0) {
      inputPelanggan.placeholder = '-- Belum ada pelanggan (Tambah pelanggan dulu) --';
      inputPelanggan.disabled = true;
    } else {
      // Mengisi datalist untuk fitur pencarian
      datalistPelanggan.innerHTML = pelangganList.map((p, idx) =>
        `<option value="${p.perusahaan.toUpperCase()}" data-idx="${idx}"></option>`
      ).join('');

      const params = new URLSearchParams(window.location.search);
      if (params.has('pelangganIdx')) {
        const idx = params.get('pelangganIdx');
        if (pelangganList[idx]) {
          inputPelanggan.value = pelangganList[idx].perusahaan.toUpperCase();
          inputPelangganIdx.value = idx;
        }
      }
    }

    // Validasi saat user mengetik/memilih dari datalist pencarian
    inputPelanggan.addEventListener('input', function() {
      const val = this.value;
      const options = datalistPelanggan.options;
      inputPelangganIdx.value = ''; // Reset dulu
      for (let i = 0; i < options.length; i++) {
        if (options[i].value === val) {
          inputPelangganIdx.value = options[i].getAttribute('data-idx');
          break;
        }
      }
    });

    // Muat draft jika user kembali dari Langkah 2
    const draft = JSON.parse(sessionStorage.getItem('kfs_step1_draft'));
    if (draft) {
      inputPelangganIdx.value = draft.pelIdx;
      if (pelangganList[draft.pelIdx]) {
        inputPelanggan.value = pelangganList[draft.pelIdx].perusahaan.toUpperCase();
      }
      document.getElementById('nomorKontrak').value = draft.nomorKontrak || '';
      document.getElementById('tanggalKontrak').value = draft.tanggalKontrak || '';
      document.getElementById('jenisLayanan').value = draft.jenisLayanan || 'Layanan Connectivity TELKOM';
      document.getElementById('availability').value = draft.availability || '99.5';
      document.getElementById('namaLayanan').value = draft.namaLayanan || '';
      document.getElementById('paket').value = draft.paket || '';
      document.getElementById('lokasi').value = draft.lokasi || '';
      document.getElementById('alamatInstalasi').value = draft.alamatInstalasi || '';
      document.getElementById('lebarPita').value = draft.lebarPita !== undefined ? draft.lebarPita : 10000;
      document.getElementById('biayaInstalasi').value = draft.biayaInstalasi !== undefined ? draft.biayaInstalasi : 0;
      document.getElementById('biayaBulanan').value = draft.biayaBulanan !== undefined ? draft.biayaBulanan : 0;
      document.getElementById('berlakuDari').value = draft.berlakuDari || '';
      document.getElementById('berlakuSampai').value = draft.berlakuSampai || '';
      document.getElementById('jangkaWaktu').value = draft.jangkaWaktu || '';
      document.getElementById('deliveryTime').value = draft.deliveryTime || '';
    }

    document.getElementById('kfsStep1Form').addEventListener('submit', function(e) {
      e.preventDefault();
      if (pelangganList.length === 0) {
        alert('Silakan tambahkan data pelanggan terlebih dahulu!');
        window.location.href = '../pelanggan/tambahpelanggan.html';
        return;
      }

      const selectedIdx = inputPelangganIdx.value;
      if (selectedIdx === '') {
        alert('Silakan pilih pelanggan yang valid dari daftar yang tersedia!');
        inputPelanggan.focus();
        return;
      }

      const pelangganTerpilih = pelangganList[selectedIdx];
      const bInst = Number(document.getElementById('biayaInstalasi').value || 0);
      const bBul = Number(document.getElementById('biayaBulanan').value || 0);

      const satuLayanan = {
        namaLayanan: document.getElementById('namaLayanan').value.trim(),
        paket: document.getElementById('paket').value.trim(),
        lokasi: document.getElementById('lokasi').value.trim(),
        alamatInstalasi: document.getElementById('alamatInstalasi').value.trim(),
        lebarPita: document.getElementById('lebarPita').value.trim(),
        biayaInstalasi: bInst,
        biayaBulanan: bBul,
        pic: (pelangganTerpilih && pelangganTerpilih.wakilNama) || '-'
      };

      const step1Data = {
        pelIdx: selectedIdx,
        pelanggan: pelangganTerpilih,
        nomorKontrak: document.getElementById('nomorKontrak').value.trim(),
        nomorAmandemen: '-',
        tanggalKontrak: document.getElementById('tanggalKontrak').value,
        availability: document.getElementById('availability').value.trim(),
        jenisLayanan: document.getElementById('jenisLayanan').value,
        daftarLayanan: [satuLayanan],
        namaLayanan: satuLayanan.namaLayanan,
        paket: satuLayanan.paket,
        lokasi: satuLayanan.lokasi,
        alamatInstalasi: satuLayanan.alamatInstalasi,
        lebarPita: satuLayanan.lebarPita,
        biayaInstalasi: bInst,
        biayaBulanan: bBul,
        biayaLainnya: 0,
        deliveryTime: document.getElementById('deliveryTime').value.trim(),
        berlakuDari: document.getElementById('berlakuDari').value,
        berlakuSampai: document.getElementById('berlakuSampai').value,
        jangkaWaktu: document.getElementById('jangkaWaktu').value.trim()
      };

      sessionStorage.setItem('kfs_step1_draft', JSON.stringify(step1Data));
      window.location.href = 'formkfs2.html';
    });
  </script>
</body>
</html>
