<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KFS Telda Banyuwangi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    #passInput::-ms-reveal,
    #passInput::-ms-clear {
      display: none;
    }

    #passInput::-webkit-credentials-auto-fill-button,
    #passInput::-webkit-textfield-decoration-container {
      display: none;
    }
  </style>
</head>
<body class="login-page d-flex align-items-center justify-content-center p-3">

  <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 text-center" style="max-width: 430px; width: 100%;">
    <h6 class="fw-bold mb-3">Login</h6>
    <div class="mb-2">
      <svg width="70" height="70" viewBox="0 0 64 64" fill="none">
        <rect x="14" y="8" width="36" height="36" rx="4" fill="#E0F2FE" stroke="#1E3A8A" stroke-width="2.5"/>
        <line x1="20" y1="16" x2="40" y2="16" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="20" y1="23" x2="36" y2="23" stroke="#1E3A8A" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M10 26L32 42L54 26V50C54 52.2 52.2 54 50 54H14C11.8 54 10 52.2 10 50V26Z" fill="#2563EB" stroke="#1E3A8A" stroke-width="2.5"/>
        <path d="M46 34L56 38V46C56 52 51.5 56.5 46 58C40.5 56.5 36 52 36 46V38L46 34Z" fill="#0D9488" stroke="#115E59" stroke-width="2"/>
        <path d="M42 46L45 49L51 43" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="fw-bold small mb-4">KFS<br>Telda Banyuwangi</p>

    <div id="errorAlert" class="alert alert-danger py-2 small fw-semibold d-none">
      Email / Nomor HP dan Kata Sandi wajib diisi!
    </div>

    <div class="mb-3">
      <input type="text" id="emailInput" class="form-control border-0 py-3 rounded-3" style="background:#c4c4c4;" placeholder="Email / Nomor HP" autocomplete="off">
    </div>
    <div class="mb-3 position-relative">
      <input type="password" id="passInput" class="form-control border-0 py-3 rounded-3" style="background:#c4c4c4; padding-right: 3rem;" placeholder="Kata Sandi" autocomplete="off">
      <button type="button" id="togglePassword" class="btn btn-link position-absolute top-50 end-0 translate-middle-y me-2 p-2 text-decoration-none text-secondary" aria-label="Tampilkan kata sandi" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
          <line id="passwordVisibilitySlash" x1="4" y1="4" x2="20" y2="20"/>
        </svg>
      </button>
    </div>
    <button type="button" id="btnLogin" class="btn w-100 py-3 fw-semibold text-white rounded-3 mt-2" style="background:#4278ad;">Masuk</button>

    <div class="text-end mt-3">
      <a href="#" class="small text-decoration-none text-telkom" onclick="alert('Hubungi Admin Telda Banyuwangi untuk reset password.')">Lupa Kata Sandi?</a>
    </div>
  </div>  

  <script>
    // Hapus data user lama setiap kali halaman login dibuka
    localStorage.removeItem('kfs_user');

    const emailField = document.getElementById('emailInput');
    const passField = document.getElementById('passInput');
    const togglePassword = document.getElementById('togglePassword');
    const passwordVisibilitySlash = document.getElementById('passwordVisibilitySlash');
    const errorAlert = document.getElementById('errorAlert');

    // Pastikan kosong saat halaman dimuat
    emailField.value = '';
    passField.value = '';

    togglePassword.addEventListener('click', function() {
      const willBeVisible = passField.type === 'password';
      passField.type = willBeVisible ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', willBeVisible ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi');
      togglePassword.setAttribute('aria-pressed', String(willBeVisible));
      passwordVisibilitySlash.classList.toggle('d-none', willBeVisible);
    });

    function prosesMasuk() {
      const email = emailField.value.trim();
      const pass = passField.value.trim();

      if (!email || !pass) {
        errorAlert.classList.remove('d-none');
        if (!email) emailField.focus();
        else passField.focus();
        return;
      }

      errorAlert.classList.add('d-none');

      // Mengambil nama dari bagian depan email (sebelum '@')
      let namaUser = email;
      if (email.includes('@')) {
        namaUser = email
          .split('@')[0]
          .replace(/[._-]+/g, ' ')
          .replace(/\b\w/g, huruf => huruf.toUpperCase())
          .trim();
      }

      localStorage.setItem('kfs_user', JSON.stringify({
        name: namaUser,
        email: email
      }));

      window.location.href = 'pelanggan/pelanggan.html';
    }

    document.getElementById('btnLogin').addEventListener('click', prosesMasuk);

    [emailField, passField].forEach(el => {
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          prosesMasuk();
        }
      });
    });
  </script>
</body>
</html>
